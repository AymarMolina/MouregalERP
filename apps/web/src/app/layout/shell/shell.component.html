<div class="flex min-h-screen bg-bg">
  <!-- Barra lateral oscura -->
  <aside class="w-60 shrink-0 bg-nav text-nav-text">
    <!-- La columna oscura ocupa todo el alto; su contenido queda fijo al hacer scroll. -->
    <div class="sticky top-0 flex h-screen flex-col">
    <div class="flex items-center gap-2.5 px-5 py-5">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-white">
        <img src="logo.webp" alt="Mouregal" width="26" height="26" class="h-[26px] w-[26px]" />
      </span>
      <div class="leading-tight">
        <div class="font-semibold text-white">Mouregal</div>
        <div class="text-xs text-nav-muted">ERP Florería</div>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 pb-4">
      @for (group of groups(); track group.label) {
        <div class="mb-4">
          <div class="px-2.5 pb-1.5 pt-2 text-[11px] font-medium uppercase tracking-wider text-nav-muted">
            {{ group.label }}
          </div>
          @for (item of group.items; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="!bg-accent !text-text font-medium"
              class="mb-0.5 flex items-center gap-2.5 rounded-lg px-2.5 py-2 text-nav-text transition-colors hover:bg-nav-hover hover:text-white"
            >
              <app-icon [name]="item.icon" [size]="17" />
              {{ item.label }}
            </a>
          }
        </div>
      }
    </nav>

    <div class="border-t border-nav-line p-3">
      <div class="flex items-center gap-2.5 rounded-lg px-2 py-2">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-nav-hover text-xs font-semibold text-white">
          {{ iniciales() }}
        </span>
        <div class="min-w-0 flex-1 leading-tight">
          <div class="truncate font-medium text-white">{{ user()?.nombre }}</div>
          <div class="text-xs capitalize text-nav-muted">{{ user()?.rol }}</div>
        </div>
        <button
          type="button"
          (click)="logout()"
          class="flex h-8 w-8 items-center justify-center rounded-lg text-nav-muted transition-colors hover:bg-nav-hover hover:text-white"
          title="Cerrar sesión"
          aria-label="Cerrar sesión"
        >
          <app-icon name="salir" [size]="17" />
        </button>
      </div>
    </div>
    </div>
  </aside>

  <!-- Canvas -->
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 shrink-0 items-center gap-2 border-b border-line bg-surface px-6 text-muted">
      @if (seccionActual()) {
        <span>{{ seccionActual() }}</span>
        <span class="text-gray-300">/</span>
      }
      <span class="font-medium text-text">{{ paginaActual() }}</span>
    </header>

    <main class="min-w-0 flex-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
