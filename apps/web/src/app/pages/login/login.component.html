<div class="min-h-screen flex items-center justify-center bg-bg">
  <div class="w-full max-w-sm bg-surface border border-line rounded p-8">
    <h1 class="text-lg font-medium mb-1">ERP Florería</h1>
    <p class="text-muted mb-6">Ingresa con tu cuenta</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block mb-1 text-muted" for="email">Correo</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full rounded border border-line px-3 py-2 bg-surface focus:outline-none focus:ring-2 focus:ring-accent"
          autocomplete="email"
        />
      </div>

      <div>
        <label class="block mb-1 text-muted" for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full rounded border border-line px-3 py-2 bg-surface focus:outline-none focus:ring-2 focus:ring-accent"
          autocomplete="current-password"
        />
      </div>

      @if (error()) {
        <p class="text-accent-2">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="form.invalid || loading()"
        class="w-full rounded bg-accent text-text font-medium py-2 disabled:opacity-50"
      >
        {{ loading() ? "Ingresando..." : "Ingresar" }}
      </button>
    </form>
  </div>
</div>
