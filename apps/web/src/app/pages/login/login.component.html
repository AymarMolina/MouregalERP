<div class="flex min-h-screen items-center justify-center bg-bg px-4">
  <div class="w-full max-w-sm">
    <div class="mb-6 flex flex-col items-center text-center">
      <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-lg bg-accent text-lg font-semibold text-text shadow-sm">
        M
      </div>
      <h1 class="text-lg font-semibold">ERP Florería</h1>
      <p class="text-muted">Ingresa con tu cuenta para continuar</p>
    </div>

    <div class="card">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="field-label" for="email">Correo</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="input"
            autocomplete="email"
            placeholder="nombre@mouregal.pe"
          />
        </div>

        <div>
          <label class="field-label" for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="input"
            autocomplete="current-password"
            placeholder="••••••••"
          />
        </div>

        @if (error()) {
          <p class="rounded-md bg-accent-soft px-3 py-2 text-accent-2">{{ error() }}</p>
        }

        <button type="submit" [disabled]="form.invalid || loading()" class="btn-primary w-full">
          {{ loading() ? "Ingresando..." : "Ingresar" }}
        </button>
      </form>
    </div>
  </div>
</div>
