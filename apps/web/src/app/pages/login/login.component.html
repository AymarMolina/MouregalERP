<!--
  Paleta Mouregal (branding):
  acento   #b584b9 #b48dbb #a382ac #9b73a1
  claros   #f4edf5 #ffffff
  oscuros  #000000 #161616 #2c2b2d #434143 #4e345a
  apagados #987f9c #73607c #6d5d72
-->
<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#2c2b2d] px-4 py-10">
  <!-- Fondo: video en bucle + velo para que la tarjeta mantenga contraste -->
  <video
    class="pointer-events-none absolute inset-0 h-full w-full object-cover"
    src="videos/fondo%20logo%20erp.mp4"
    autoplay
    loop
    [muted]="true"
    playsinline
    preload="auto"
    aria-hidden="true"
  ></video>
  <div class="pointer-events-none absolute inset-0 bg-[#161616]/35"></div>

  <!-- Tarjeta -->
  <main
    class="relative w-full max-w-[420px] rounded-2xl bg-[#ffffff] px-8 py-9 shadow-[0_24px_64px_-16px_rgba(78,52,90,0.55),0_2px_6px_rgba(78,52,90,0.12)] ring-1 ring-[#b48dbb]/30 backdrop-blur-md sm:px-10"
  >
    <img src="logo-mouregal.png" alt="Mouregal · Flores y Detalles Deluxe" width="160" height="120" class="mx-auto h-auto w-40" />

    <h1 class="mt-6 text-[22px] font-semibold leading-tight tracking-[-0.01em] text-[#4e345a]">
      Inicia sesión en tu cuenta
    </h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-7 space-y-5" novalidate>
      <div>
        <label for="email" class="mb-1.5 block text-[13px] font-medium text-[#434143]">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="block h-10 w-full rounded-md border bg-[#ffffff] px-3 text-[14px] text-[#161616] shadow-[0_1px_1px_rgba(78,52,90,0.05)] outline-none transition placeholder:text-[#987f9c] hover:border-[#a382ac] focus:border-[#9b73a1] focus:ring-[3px] focus:ring-[#b584b9]/25"
          [class]="invalido('email') ? 'border-[#c0123c]' : 'border-[#987f9c]/40'"
        />
        @if (invalido("email")) {
          <p class="mt-1.5 text-[12px] text-[#c0123c]">Ingresa un correo válido.</p>
        }
      </div>

      <div>
        <div class="mb-1.5 flex items-center justify-between">
          <label for="password" class="text-[13px] font-medium text-[#434143]">Contraseña</label>
          <button
            type="button"
            (click)="avisar('recuperar')"
            class="text-[13px] font-medium text-[#9b73a1] transition hover:text-[#4e345a]"
          >
            ¿No recuerdas la contraseña?
          </button>
        </div>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="block h-10 w-full rounded-md border bg-[#ffffff] px-3 text-[14px] text-[#161616] shadow-[0_1px_1px_rgba(78,52,90,0.05)] outline-none transition placeholder:text-[#987f9c] hover:border-[#a382ac] focus:border-[#9b73a1] focus:ring-[3px] focus:ring-[#b584b9]/25"
          [class]="invalido('password') ? 'border-[#c0123c]' : 'border-[#987f9c]/40'"
        />
        @if (invalido("password")) {
          <p class="mt-1.5 text-[12px] text-[#c0123c]">Ingresa tu contraseña.</p>
        }
      </div>

      <label class="flex cursor-pointer select-none items-center gap-2.5 text-[13px] text-[#434143]">
        <input
          type="checkbox"
          formControlName="recordar"
          class="h-4 w-4 cursor-pointer rounded border-[#987f9c] accent-[#9b73a1]"
        />
        Recuérdame en este dispositivo
      </label>

      @if (error()) {
        <p role="alert" class="rounded-md bg-[#ffffff] px-3 py-2 text-[13px] text-[#c0123c] ring-1 ring-[#c0123c]/25">
          {{ error() }}
        </p>
      }
      @if (aviso()) {
        <p role="status" class="rounded-md bg-[#ffffff] px-3 py-2 text-[13px] text-[#4e345a] ring-1 ring-[#b48dbb]/50">
          {{ aviso() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="flex h-10 w-full items-center justify-center gap-2 rounded-md bg-[#9b73a1] text-[14px] font-semibold text-[#ffffff] shadow-[0_1px_2px_rgba(78,52,90,0.3),inset_0_1px_0_rgba(255,255,255,0.15)] transition hover:bg-[#73607c] focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-[#b584b9]/45 disabled:cursor-not-allowed disabled:opacity-70"
      >
        @if (loading()) {
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
          Iniciando sesión…
        } @else {
          Iniciar sesión
        }
      </button>
    </form>

    <p class="mt-8 text-center text-[13px] text-[#6d5d72]">
      ¿Eres nuevo en Mouregal?
      <button type="button" (click)="avisar('registro')" class="font-medium text-[#9b73a1] transition hover:text-[#4e345a]">
        Crea una cuenta
      </button>
    </p>
  </main>
</div>
